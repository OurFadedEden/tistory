<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP 페어틀 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Gowun+Batang&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12101f;
    --panel:#1c192e;
    --line:#332e4d;
    --text:#d6cfee;
    --sub:#8b84a8;
    --amber:#f2c268;
    --violet:#9d8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Galmuri11',sans-serif;
    min-height:100vh;padding:20px 14px 60px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
  }
  h1{font-family:'Galmuri14',sans-serif;font-size:15px;letter-spacing:1px;color:var(--amber)}
  h1 span{color:var(--violet)}

  /* ---------- 카드 (4:3) ---------- */
  #card{
    position:relative;width:min(420px,94vw);aspect-ratio:4/3;
    border-radius:14px;overflow:hidden;background:#0a0816;
    box-shadow:5px 5px 0 #000;flex:none;
  }
  #cardBg{
    position:absolute;inset:-28px;
    background:linear-gradient(160deg,#2b2350,#0d0b1a 60%,#3d2a4d) center/cover no-repeat;
    filter:blur(14px);
  }
  #cardDim{position:absolute;inset:0}
  #cardFrame{position:absolute;inset:4.5%;border:1px solid;border-radius:10px;pointer-events:none}
  #cardInner{position:absolute;inset:4.5%;padding:5%;display:flex;align-items:center;gap:6%}

  /* 턴테이블 */
  #tt{position:relative;width:48%;aspect-ratio:1;flex:none}
  #platter{
    position:absolute;inset:0;border-radius:50%;
    background:rgba(0,0,0,.38);
    box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.18);
  }
  #disc{
    position:absolute;inset:6.5%;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle,#2a2440 0%,#141122 70%);
  }
  #disc.spin{animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #discPhoto{position:absolute;inset:0;background:center/cover no-repeat}
  #discEmpty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.35);font-size:10px;letter-spacing:1px;
  }
  #discRing{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
  #spindle{
    position:absolute;left:50%;top:50%;width:3.2%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:#0a0816;border:1.5px solid rgba(255,255,255,.55);
  }
  #tonearm{position:absolute;inset:-6%;pointer-events:none;overflow:visible}

  /* 오른쪽 텍스트 영역 */
  #meta{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
  #cardTitle{
    width:100%;font-size:17px;line-height:1.3;overflow-wrap:anywhere;
    text-shadow:0 1px 6px rgba(0,0,0,.45);
  }
  #cardSub{width:100%;font-size:10px;opacity:.68;margin-top:5px;letter-spacing:1px}
  #barWrap{width:100%;margin-top:14px}
  #barTrack{position:relative;height:4px;border-radius:2px}
  #barFill{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
  #barKnob{
    position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(0,0,0,.5);
  }
  #times{display:flex;justify-content:space-between;font-size:9px;opacity:.85;margin-top:6px}
  #cardCaption{
    position:absolute;left:0;right:0;bottom:10.5%;
    text-align:center;font-size:9px;letter-spacing:2px;
    text-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none;
  }
  #ctrls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:12px;width:100%}
  #ctrls svg{display:block}

  /* ---------- 컨트롤 패널 ---------- */
  #panel{
    width:min(420px,94vw);background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:4px 4px 0 #000;
    padding:16px 14px;display:flex;flex-direction:column;gap:14px;font-size:11px;
  }
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{color:var(--sub);font-size:10px;letter-spacing:1px}
  .row label b{color:var(--amber);font-weight:normal}
  input[type=text], select{
    background:#12101f;border:1px solid var(--line);border-radius:7px;
    color:var(--text);font-family:inherit;font-size:12px;padding:9px 10px;outline:none;width:100%;
  }
  input[type=text]:focus, select:focus{border-color:var(--violet)}
  input[type=range]{width:100%;accent-color:var(--violet)}
  .fileBtn{
    display:block;text-align:center;cursor:pointer;
    background:#12101f;border:1px dashed var(--line);border-radius:7px;
    padding:10px;color:var(--sub);
  }
  .fileBtn.has{border-style:solid;border-color:var(--amber);color:var(--amber)}
  input[type=file]{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .colorRow{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  input[type=color]{
    width:100%;height:38px;border:1px solid var(--line);border-radius:7px;
    background:#12101f;padding:3px;cursor:pointer;
  }
  .toggleRow{flex-direction:row;align-items:center;justify-content:space-between}
  .toggleRow label{font-size:11px;color:var(--text)}
  .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .saveBtn{
    font-family:'Galmuri14',sans-serif;font-size:13px;cursor:pointer;
    border:none;border-radius:8px;padding:12px;box-shadow:3px 3px 0 #000;
  }
  #savePng{background:var(--amber);color:#1a1428}
  #saveGif{background:var(--violet);color:#161226}
  .saveBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .saveBtn:disabled{opacity:.6;cursor:wait}
  .hint{font-size:9px;color:var(--sub);line-height:1.5}
  .secTitle{
    font-family:'Galmuri14',sans-serif;font-size:11px;color:var(--violet);
    border-bottom:1px solid var(--line);padding-bottom:6px;
  }
</style>
</head>
<body>

<h1>♪ LP <span>페어틀</span> 생성기</h1>

<!-- 미리보기 -->
<div id="card">
  <div id="cardBg"></div>
  <div id="cardDim"></div>
  <div id="cardFrame"></div>
  <div id="cardInner">
    <div id="tt">
      <div id="platter"></div>
      <div id="disc" class="spin">
        <div id="discPhoto"></div>
        <div id="discEmpty">PHOTO</div>
        <div id="discRing"></div>
      </div>
      <div id="spindle"></div>
      <svg id="tonearm" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line id="armLine1" x1="88" y1="12" x2="86" y2="34" stroke-width="1.9" stroke-linecap="round"/>
        <line id="armLine2" x1="86" y1="34" x2="70.5" y2="54" stroke-width="1.9" stroke-linecap="round"/>
        <rect id="armHead" x="68" y="50.5" width="5" height="8" rx="1.5" transform="rotate(-35 70.5 54.5)"/>
        <circle id="armPivot" cx="88" cy="12" r="5"/>
        <circle id="armPivotIn" cx="88" cy="12" r="2"/>
      </svg>
    </div>
    <div id="meta">
      <div id="cardTitle">플레이리스트 제목</div>
      <div id="cardSub"></div>
      <div id="barWrap">
        <div id="barTrack"><div id="barFill"></div><div id="barKnob"></div></div>
        <div id="times"><span id="tCur">1:24</span><span id="tTot">3:42</span></div>
      </div>
      <div id="ctrls">
        <svg class="cIcon" width="16" height="16" viewBox="0 0 24 24">
          <rect x="4" y="5" width="2.6" height="14" rx="1"/>
          <path d="M20 5 L9 12 L20 19 Z"/>
        </svg>
        <svg class="cIcon" width="20" height="20" viewBox="0 0 24 24">
          <path d="M6.5 4 L20 12 L6.5 20 Z"/>
        </svg>
        <svg class="cIcon" width="16" height="16" viewBox="0 0 24 24">
          <path d="M4 5 L15 12 L4 19 Z"/>
          <rect x="17.4" y="5" width="2.6" height="14" rx="1"/>
        </svg>
      </div>
    </div>
  </div>
  <div id="cardCaption"></div>
</div>

<!-- 컨트롤 -->
<div id="panel">
  <div class="secTitle">이미지</div>
  <div class="row">
    <label>LP 사진 <b>(배경 블러 연동)</b></label>
    <label class="fileBtn" id="lpFileBtn">사진 선택하기<input type="file" id="lpFile" accept="image/*"></label>
  </div>
  <div class="row">
    <label>배경 따로 쓰기 (선택)</label>
    <label class="fileBtn" id="bgFileBtn">기본: LP 사진 블러<input type="file" id="bgFile" accept="image/*"></label>
  </div>
  <div class="grid2">
    <div class="row">
      <label>배경 블러 <b id="blurLabel">14</b></label>
      <input type="range" id="blurRange" min="0" max="40" value="14">
    </div>
    <div class="row">
      <label>배경 어둡기 <b id="dimLabel">45%</b></label>
      <input type="range" id="dimRange" min="0" max="85" value="45">
    </div>
  </div>

  <div class="secTitle">텍스트</div>
  <div class="row">
    <label>플레이리스트 제목</label>
    <input type="text" id="titleInput" value="플레이리스트 제목" maxlength="40">
  </div>
  <div class="row">
    <label>서브 텍스트 (페어명 등, 선택)</label>
    <input type="text" id="subInput" placeholder="예: 심해 × 황혼" maxlength="40">
  </div>
  <div class="row">
    <label>하단 문구 (카드 아래 중앙, 선택)</label>
    <input type="text" id="captionInput" placeholder="예: Our Faded Eden" maxlength="60">
  </div>
  <div class="row">
    <label>글씨체</label>
    <select id="fontSel">
      <option value="Galmuri14">갈무리14 (픽셀)</option>
      <option value="Galmuri11">갈무리11 (픽셀·얇게)</option>
      <option value="Pretendard">프리텐다드 (고딕)</option>
      <option value="Noto Serif KR">노토 세리프 (명조)</option>
      <option value="Gowun Batang">고운바탕 (바탕)</option>
      <option value="Nanum Pen Script">나눔손글씨 펜</option>
    </select>
  </div>

  <div class="secTitle">색상</div>
  <div class="grid3">
    <div class="colorRow"><label>텍스트</label><input type="color" id="textColor" value="#ffffff"></div>
    <div class="colorRow"><label>포인트</label><input type="color" id="pointColor" value="#ffffff"></div>
    <div class="colorRow"><label>프레임</label><input type="color" id="frameColor" value="#ffffff"></div>
  </div>
  <div class="hint">포인트 = 재생바·톤암·컨트롤 색 / 프레임 = 테두리 선 색</div>

  <div class="secTitle">재생바</div>
  <div class="grid2">
    <div class="row">
      <label>전체 시간</label>
      <input type="text" id="totInput" value="3:42" maxlength="7">
    </div>
    <div class="row">
      <label>재생 위치 <b id="pctLabel">38%</b></label>
      <input type="range" id="pctRange" min="0" max="100" value="38">
    </div>
  </div>
  <div class="row toggleRow">
    <label>LP 회전 (미리보기)</label>
    <input type="checkbox" id="spinChk" checked>
  </div>
  <div class="row">
    <label>회전 속도 — 한 바퀴 <b id="speedLabel">4초</b></label>
    <input type="range" id="speedRange" min="2" max="12" step="0.5" value="4">
  </div>

  <div class="btnRow">
    <button class="saveBtn" id="savePng">PNG 저장</button>
    <button class="saveBtn" id="saveMp4">MP4 저장</button>
  </div>
  <div class="hint">
    PNG·MP4 모두 1600×1200 고화질. MP4는 설정한 회전 속도로 LP가 두 바퀴 도는 영상이라
    시작과 끝 각도가 같아, 영상에 이어 붙이거나 반복 재생해도 끊김 없이 돌아가요.
    (브라우저가 MP4를 지원하지 않으면 WebM으로 저장돼요.)
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lpImg = null, bgImg = null, lpURL = null, bgURL = null;

function loadFile(input, cb){
  const f = input.files && input.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => cb(img, url);
  img.src = url;
}
$('lpFile').addEventListener('change', e => loadFile(e.target,(img,url)=>{
  lpImg=img; lpURL=url;
  $('lpFileBtn').classList.add('has');
  $('lpFileBtn').firstChild.textContent='사진 변경하기';
  render();
}));
$('bgFile').addEventListener('change', e => loadFile(e.target,(img,url)=>{
  bgImg=img; bgURL=url;
  $('bgFileBtn').classList.add('has');
  $('bgFileBtn').firstChild.textContent='배경 변경하기';
  render();
}));

['titleInput','subInput','totInput','captionInput'].forEach(id=>$(id).addEventListener('input',render));
['pctRange','blurRange','dimRange'].forEach(id=>$(id).addEventListener('input',render));
['textColor','pointColor','frameColor'].forEach(id=>$(id).addEventListener('input',render));
$('fontSel').addEventListener('change',render);
$('spinChk').addEventListener('change',()=>$('disc').classList.toggle('spin',$('spinChk').checked));
$('speedRange').addEventListener('input',()=>{
  const s=+$('speedRange').value;
  $('speedLabel').textContent=s+'초';
  $('disc').style.animationDuration=s+'s';
});
$('disc').style.animationDuration=$('speedRange').value+'s';

function parseTime(s){
  const m = String(s).trim().match(/^(\d+):([0-5]?\d)$/);
  return m ? (+m[1])*60+(+m[2]) : null;
}
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

function render(){
  const pct=+$('pctRange').value, blur=+$('blurRange').value, dim=+$('dimRange').value;
  const tc=$('textColor').value, pc=$('pointColor').value, fc=$('frameColor').value;
  const font=$('fontSel').value;
  $('pctLabel').textContent=pct+'%';
  $('blurLabel').textContent=blur;
  $('dimLabel').textContent=dim+'%';

  const useBg = bgURL || lpURL;
  $('cardBg').style.backgroundImage = useBg?`url(${useBg})`:'';
  $('cardBg').style.filter=`blur(${blur}px)`;
  $('cardDim').style.background=`rgba(8,6,18,${dim/100})`;

  $('cardFrame').style.borderColor = hexA(fc,.4);
  $('cardFrame').style.background  = hexA(fc,.05);

  if(lpURL){
    $('discPhoto').style.backgroundImage=`url(${lpURL})`;
    $('discEmpty').style.display='none';
  }else{
    $('discPhoto').style.backgroundImage='';
    $('discEmpty').style.display='flex';
  }

  const arm = hexA(pc,.95);
  ['armLine1','armLine2'].forEach(id=>$(id).setAttribute('stroke',arm));
  $('armHead').setAttribute('fill',arm);
  $('armPivot').setAttribute('fill',hexA(pc,.9));
  $('armPivotIn').setAttribute('fill','rgba(10,8,22,.9)');

  const meta=$('meta');
  meta.style.fontFamily=`'${font}', sans-serif`;
  meta.style.color=tc;
  $('cardTitle').textContent=$('titleInput').value||' ';
  $('cardTitle').style.fontSize = (font==='Nanum Pen Script')?'22px':'17px';
  const sub=$('subInput').value;
  $('cardSub').textContent=sub;
  $('cardSub').style.display=sub?'block':'none';

  const cap=$('cardCaption');
  cap.textContent=$('captionInput').value;
  cap.style.fontFamily=`'${font}', sans-serif`;
  cap.style.color=hexA(tc,.75);

  const tot=parseTime($('totInput').value)??222;
  $('tTot').textContent=fmt(tot);
  $('tCur').textContent=fmt(tot*pct/100);
  $('barTrack').style.background=hexA(pc,.3);
  $('barFill').style.background=pc;
  $('barFill').style.width=pct+'%';
  $('barKnob').style.background=pc;
  $('barKnob').style.left=pct+'%';

  document.querySelectorAll('.cIcon rect, .cIcon path').forEach(el=>el.setAttribute('fill',pc));
}
render();

/* ---------- 캔버스 렌더링 (PNG·GIF 공용) ---------- */
function drawCover(ctx,img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height);
  const sw=w/s, sh=h/s;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fitText(ctx,text,font,maxSize,maxW){
  let size=maxSize;
  do{
    ctx.font=`${size}px '${font}', sans-serif`;
    if(ctx.measureText(text).width<=maxW) break;
    size-=2;
  }while(size>14);
  return size;
}
function state(){
  return {
    pct:+$('pctRange').value,
    blur:+$('blurRange').value,
    dim:+$('dimRange').value/100,
    tc:$('textColor').value,
    pc:$('pointColor').value,
    fc:$('frameColor').value,
    font:$('fontSel').value,
    title:$('titleInput').value||' ',
    sub:$('subInput').value,
    caption:$('captionInput').value,
    tot:parseTime($('totInput').value)??222
  };
}
function geo(W,H){
  const fx=W*0.045, fy=H*0.045*4/3;
  const fw=W-fx*2, fh=H-fy*2;
  const pad=fw*0.05;
  const Rp=fw*0.48*0.96/2;
  const cx=fx+pad+Rp, cy=H/2;
  const Rd=Rp*0.935;
  const mx1=cx+Rp+fw*0.06, mx2=fx+fw-pad;
  return {fx,fy,fw,fh,pad,Rp,Rd,cx,cy,mx1,mx2,mw:mx2-mx1,mcx:(mx1+mx2)/2,S:W/1600};
}

/* 정적 레이어: 배경 + 프레임 + 플래터 + 텍스트 + 재생바 + 컨트롤 */
function drawBase(ctx,W,H,st){
  const g=geo(W,H), S=g.S;

  // 배경
  const bg = bgImg || lpImg;
  if(bg){
    ctx.save();
    ctx.filter=`blur(${st.blur*2.8*S}px)`;
    drawCover(ctx,bg,-90*S,-90*S,W+180*S,H+180*S);
    ctx.restore();
  }else{
    const gr=ctx.createLinearGradient(0,0,W,H);
    gr.addColorStop(0,'#2b2350'); gr.addColorStop(.6,'#0d0b1a'); gr.addColorStop(1,'#3d2a4d');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
  ctx.fillStyle=`rgba(8,6,18,${st.dim})`;
  ctx.fillRect(0,0,W,H);

  // 프레임
  ctx.fillStyle=hexA(st.fc,.05);
  rr(ctx,g.fx,g.fy,g.fw,g.fh,26*S); ctx.fill();
  ctx.strokeStyle=hexA(st.fc,.4); ctx.lineWidth=3*S;
  rr(ctx,g.fx,g.fy,g.fw,g.fh,26*S); ctx.stroke();

  // 플래터
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=40*S; ctx.shadowOffsetY=14*S;
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.Rp,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.38)'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.Rp,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2*S; ctx.stroke();

  // 텍스트
  ctx.textAlign='center';
  ctx.fillStyle=st.tc;
  const baseSize=(st.font==='Nanum Pen Script')?88:64;
  const tSize=fitText(ctx,st.title,st.font,baseSize*S,g.mw);
  let ty=H*0.42;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=12*S; ctx.shadowOffsetY=2*S;
  ctx.font=`${tSize}px '${st.font}', sans-serif`;
  ctx.fillText(st.title,g.mcx,ty,g.mw);
  ctx.restore();

  if(st.sub){
    ty+=tSize*0.72;
    ctx.font=`${((st.font==='Nanum Pen Script')?42:30)*S}px '${st.font}', sans-serif`;
    ctx.fillStyle=hexA(st.tc,.68);
    ctx.fillText(st.sub,g.mcx,ty,g.mw);
  }

  // 재생바
  const by=ty+H*0.075, bx=g.mx1;
  ctx.lineCap='round';
  ctx.strokeStyle=hexA(st.pc,.3); ctx.lineWidth=8*S;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+g.mw,by); ctx.stroke();
  ctx.strokeStyle=st.pc;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+g.mw*st.pct/100,by); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx+g.mw*st.pct/100,by,12*S,0,Math.PI*2);
  ctx.fillStyle=st.pc; ctx.fill();

  ctx.font=`${26*S}px '${st.font}', sans-serif`;
  ctx.fillStyle=hexA(st.tc,.85);
  ctx.textAlign='left';  ctx.fillText(fmt(st.tot*st.pct/100),bx,by+44*S);
  ctx.textAlign='right'; ctx.fillText(fmt(st.tot),bx+g.mw,by+44*S);

  // 컨트롤 ⏮ ▶ ⏭
  const cyc=by+H*0.085, mcx=g.mcx;
  ctx.fillStyle=st.pc;
  // 이전곡
  const px0=mcx-110*S;
  rr(ctx,px0-22*S,cyc-15*S,5*S,30*S,2*S); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px0+16*S,cyc-15*S); ctx.lineTo(px0+16*S,cyc+15*S); ctx.lineTo(px0-11*S,cyc);
  ctx.closePath(); ctx.fill();
  // 재생
  ctx.beginPath();
  ctx.moveTo(mcx-14*S,cyc-20*S); ctx.lineTo(mcx-14*S,cyc+20*S); ctx.lineTo(mcx+22*S,cyc);
  ctx.closePath(); ctx.fill();
  // 다음곡
  const nx0=mcx+110*S;
  ctx.beginPath();
  ctx.moveTo(nx0-16*S,cyc-15*S); ctx.lineTo(nx0-16*S,cyc+15*S); ctx.lineTo(nx0+11*S,cyc);
  ctx.closePath(); ctx.fill();
  rr(ctx,nx0+17*S,cyc-15*S,5*S,30*S,2*S); ctx.fill();

  // 하단 중앙 문구
  if(st.caption){
    ctx.save();
    ctx.textAlign='center';
    ctx.font=`${26*S}px '${st.font}', sans-serif`;
    ctx.fillStyle=hexA(st.tc,.75);
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=10*S; ctx.shadowOffsetY=1*S;
    const spaced=st.caption.split('').join('\u200a\u200a');
    ctx.fillText(spaced,W/2,H-H*0.10,g.fw*0.9);
    ctx.restore();
  }
}

/* 디스크(사진) — angle(라디안)만큼 회전 */
function drawDisc(ctx,W,H,angle){
  const g=geo(W,H), S=g.S;
  ctx.save();
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.Rd,0,Math.PI*2); ctx.clip();
  ctx.translate(g.cx,g.cy); ctx.rotate(angle);
  if(lpImg){ drawCover(ctx,lpImg,-g.Rd,-g.Rd,g.Rd*2,g.Rd*2); }
  else{
    const gr=ctx.createRadialGradient(0,0,0,0,0,g.Rd);
    gr.addColorStop(0,'#2a2440'); gr.addColorStop(1,'#141122');
    ctx.fillStyle=gr; ctx.fillRect(-g.Rd,-g.Rd,g.Rd*2,g.Rd*2);
  }
  ctx.rotate(-angle); ctx.translate(-g.cx,-g.cy);
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.Rd-3*S,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=6*S; ctx.stroke();
  ctx.restore();
}

/* 상단 고정 요소: 스핀들 + 톤암 */
function drawTop(ctx,W,H,st){
  const g=geo(W,H), S=g.S, Rp=g.Rp;
  // 스핀들 (작게)
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.Rd*0.028,0,Math.PI*2);
  ctx.fillStyle='#0a0816'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2.5*S; ctx.stroke();

  // 톤암
  const tOri=g.cx-Rp*1.12, tSize=Rp*2.24;
  const m=(px,py)=>[tOri+px/100*tSize, g.cy-Rp*1.12+py/100*tSize];
  const [p1x,p1y]=m(88,12), [p2x,p2y]=m(86,34), [p3x,p3y]=m(70.5,54);
  ctx.strokeStyle=hexA(st.pc,.95); ctx.lineWidth=Rp*0.04; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p1x,p1y); ctx.lineTo(p2x,p2y); ctx.lineTo(p3x,p3y); ctx.stroke();
  ctx.save();
  ctx.translate(p3x,p3y); ctx.rotate(-35*Math.PI/180);
  ctx.fillStyle=hexA(st.pc,.95);
  rr(ctx,-Rp*0.055,-Rp*0.035,Rp*0.11,Rp*0.17,Rp*0.03); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(p1x,p1y,Rp*0.105,0,Math.PI*2);
  ctx.fillStyle=hexA(st.pc,.9); ctx.fill();
  ctx.beginPath(); ctx.arc(p1x,p1y,Rp*0.042,0,Math.PI*2);
  ctx.fillStyle='rgba(10,8,22,.9)'; ctx.fill();
}

async function loadFonts(font){
  try{
    await Promise.all([
      document.fonts.load(`60px '${font}'`),
      document.fonts.load(`30px '${font}'`)
    ]);
    await document.fonts.ready;
  }catch(e){}
}

/* ---------- PNG ---------- */
$('savePng').addEventListener('click', async ()=>{
  const st=state();
  await loadFonts(st.font);
  const W=1600,H=1200;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  drawBase(ctx,W,H,st);
  drawDisc(ctx,W,H,0);
  drawTop(ctx,W,H,st);
  const a=document.createElement('a');
  a.download='lp-pair-frame.png';
  a.href=cv.toDataURL('image/png');
  a.click();
});

/* ---------- MP4 (완전 루프: 4초/바퀴 × 2바퀴 = 8초, 시작·끝 각도 동일) ---------- */
$('saveMp4').addEventListener('click', async ()=>{
  const btn=$('saveMp4');
  btn.disabled=true;
  const st=state();
  await loadFonts(st.font);

  try{
    const W=1600,H=1200;
    const ROT=(+$('speedRange').value)*1000;   // 슬라이더 값 = 한 바퀴 시간
    const LOOPS=2;           // 두 바퀴 녹화
    const FPS=30;

    // 정적 레이어는 한 번만 그려둠
    const baseCv=document.createElement('canvas');
    baseCv.width=W; baseCv.height=H;
    drawBase(baseCv.getContext('2d'),W,H,st);

    const cv=document.createElement('canvas');
    cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.drawImage(baseCv,0,0);
    drawDisc(ctx,W,H,0);
    drawTop(ctx,W,H,st);

    const types=[
      'video/mp4;codecs=avc1.640028',
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4',
      'video/webm;codecs=vp9',
      'video/webm'
    ];
    const mime=types.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if(!mime) throw new Error('MediaRecorder 미지원');
    const ext=mime.startsWith('video/mp4')?'mp4':'webm';

    const stream=cv.captureStream(FPS);
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14_000_000});
    const chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    const stopped=new Promise(res=>rec.onstop=res);
    rec.start(250);

    const total=ROT*LOOPS;
    const t0=performance.now();
    await new Promise(res=>{
      function frame(now){
        const el=Math.min(now-t0,total);
        const angle=((el%ROT)/ROT)*Math.PI*2;
        ctx.clearRect(0,0,W,H);
        ctx.drawImage(baseCv,0,0);
        drawDisc(ctx,W,H,angle);
        drawTop(ctx,W,H,st);
        btn.textContent=`녹화 중… ${(el/1000).toFixed(1)}/${total/1000}s`;
        if(el<total) requestAnimationFrame(frame);
        else res();
      }
      requestAnimationFrame(frame);
    });
    rec.stop();
    await stopped;

    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement('a');
    a.download=`lp-pair-frame.${ext}`;
    a.href=URL.createObjectURL(blob);
    a.click();
    if(ext==='webm') alert('이 브라우저는 MP4 녹화를 지원하지 않아 WebM으로 저장했어요. 크롬/사파리 최신 버전에서는 MP4로 저장됩니다.');
  }catch(err){
    alert('영상 생성에 실패했어요. 최신 크롬 또는 사파리에서 다시 시도해 주세요.');
    console.error(err);
  }finally{
    btn.disabled=false;
    btn.textContent='MP4 저장';
  }
});
</script>
